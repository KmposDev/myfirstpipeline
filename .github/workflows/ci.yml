
name: TaskFlow API - CI/CD

on:
  push:
    branches: [parte-b-fastapi]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Calidad, pruebas y seguridad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Check code quality
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Run tests
        run: |
          python -m pytest -v --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=80

      - name: Audit dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

  docker:
    name: Docker build and smoke test
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t taskflow-api:ci .

      - name: Smoke test
        run: |
          docker run -d --name taskflow-smoke -p 8000:8000 taskflow-api:ci

          for i in {1..15}; do
            if curl -fsS http://localhost:8000/health; then
              echo "Smoke test superado"
              docker stop taskflow-smoke
              exit 0
            fi
            sleep 2
          done

          docker logs taskflow-smoke
          exit 1

      - name: Login to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish Docker image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag taskflow-api:ci ghcr.io/kmposdev/taskflow-api:${{ github.ref_name }}
          docker push ghcr.io/kmposdev/taskflow-api:${{ github.ref_name }}
